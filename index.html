<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">

<title>Tattoo Shading Pro</title>

<!-- VIEWPORT / iPAD -->
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#111111">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tattoo Shading Pro">

<!-- ICONS (VIGTIGT FOR HJEMMESKÆRM) -->
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">

<!-- MANIFEST -->
<link rel="manifest" href="manifest.json">

<style>
body{
  margin:0;
  background:#111;
  color:#eee;
  font-family:Arial, Helvetica, sans-serif;
}

header{
  text-align:center;
  padding:10px;
  font-weight:bold;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  padding:10px;
}

.viewer{
  display:flex;
  justify-content:center;
  padding:10px;
}

canvas{
  background:#fff;
  max-width:100%;
  max-height:70vh; /* JUSTÉR TIL iPAD */
  border-radius:8px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.progress{
  height:14px;
  background:#333;
  margin:10px;
  border-radius:7px;
  overflow:hidden;
}

.progress div{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#666,#eee);
  font-size:10px;
  color:#000;
  text-align:center;
}

.guide{
  padding:12px;
  max-width:900px;
  margin:auto;
  font-size:14px;
  line-height:1.5;
}
</style>
</head>

<body>

<header>🖤 Tattoo Shading Pro – Studio Engine</header>

<div class="controls">
  <input type="file" id="upload">
  <select id="style">
    <option value="luxury">Luxury realism</option>
    <option value="dirty">Dirty illustrative</option>
  </select>
  <button onclick="generateShading()">Generate shading</button>
</div>

<div class="progress"><div id="bar">0%</div></div>

<div class="viewer">
  <canvas id="canvas"></canvas>
</div>

<div class="guide" id="guide"></div>

<script>
/* ===============================
   SERVICE WORKER AUTO-UPDATE
================================ */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    window.location.reload();
  });
}

/* ===============================
   CORE VARIABLES
================================ */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const bar = document.getElementById("bar");
const guide = document.getElementById("guide");

let outlineImage = null;
let shadingCanvas = null;

/* ===============================
   UPLOAD STENCIL
================================ */
document.getElementById("upload").onchange = e => {
  const img = new Image();
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img,0,0);
    outlineImage = ctx.getImageData(0,0,canvas.width,canvas.height);
  };
  img.src = URL.createObjectURL(e.target.files[0]);
};

/* ===============================
   SHADING ENGINE (STROKE BASED)
================================ */
function generateShading(){
  if(!outlineImage) return;

  shadingCanvas = document.createElement("canvas");
  shadingCanvas.width = canvas.width;
  shadingCanvas.height = canvas.height;
  const sctx = shadingCanvas.getContext("2d");

  const style = document.getElementById("style").value;

  const totalStrokes = style === "dirty" ? 9500 : 7000;
  const maxLength   = style === "dirty" ? 48 : 32;
  const baseAlpha   = style === "dirty" ? 0.065 : 0.045;
  const lightAngle  = -Math.PI/3; // ÉN lyskilde

  let i = 0;

  function drawBatch(){
    for(let n=0;n<140 && i<totalStrokes;n++,i++){
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      const idx = ((y|0)*canvas.width + (x|0)) * 4;

      // Kun skygge nær outline
      if(outlineImage.data[idx] < 80){
        const len = maxLength * (0.4 + Math.random());
        const angle = lightAngle + (Math.random()-0.5)*0.4;

        const grad = sctx.createLinearGradient(
          x, y,
          x + Math.cos(angle)*len,
          y + Math.sin(angle)*len
        );

        grad.addColorStop(0, `rgba(0,0,0,${baseAlpha})`);
        grad.addColorStop(1, "rgba(0,0,0,0)");

        sctx.strokeStyle = grad;
        sctx.lineWidth = 1 + Math.random()*2;
        sctx.beginPath();
        sctx.moveTo(x,y);
        sctx.lineTo(
          x + Math.cos(angle)*len,
          y + Math.sin(angle)*len
        );
        sctx.stroke();
      }
    }

    bar.style.width = Math.round(i/totalStrokes*100) + "%";
    bar.innerText  = Math.round(i/totalStrokes*100) + "%";

    // Tegn ALDRIG oven på outline
    ctx.putImageData(outlineImage,0,0);
    ctx.drawImage(shadingCanvas,0,0);

    if(i < totalStrokes){
      requestAnimationFrame(drawBatch);
    }else{
      finishGuide();
    }
  }

  drawBatch();
}

/* ===============================
   AUTO NEEDLE / GREYWASH GUIDE
================================ */
function finishGuide(){
  bar.innerText = "Ready";

  guide.innerHTML = `
<b>Auto Tattoo Guide – Poseidon Lucius</b><br><br>

<b>Heavy shadow zones</b><br>
• Needle: 11–13RM<br>
• Greywash: 1:3 – 1:4<br>
• Voltage: 8.8 – 9.2V<br><br>

<b>Medium blend zones</b><br>
• Needle: 15–17M<br>
• Greywash: 1:6 – 1:8<br>
• Voltage: 7.5 – 8.0V<br><br>

<b>Light whip / fade</b><br>
• Needle: 17–23CM<br>
• Greywash: 1:10 – 1:12<br>
• Voltage: 6.8 – 7.2V<br><br>

<b>Style:</b> ${document.getElementById("style").value}
`;
}
</script>

</body>
</html>
