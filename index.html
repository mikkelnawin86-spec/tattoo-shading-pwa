<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tattoo Shading Pro</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#111;
  color:#fff;
}
header{
  padding:12px;
  text-align:center;
  background:#000;
  font-weight:600;
}
main{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  padding:10px;
}
canvas{
  width:100%;
  max-width:900px;
  margin:auto;
  background:#fff;
  border-radius:8px;
}
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
}
button{
  padding:10px 14px;
  border-radius:8px;
  border:none;
  background:#222;
  color:#fff;
  font-weight:600;
}
button:active{ background:#444; }
input[type=file]{ color:#fff; }
</style>
</head>

<body>
<header>Tattoo Shading Pro – Black & Grey</header>

<main>
  <input type="file" accept="image/*" id="upload">
  <canvas id="canvas"></canvas>

  <div class="controls">
    <button onclick="generateShading('light')">Light</button>
    <button onclick="generateShading('medium')">Medium</button>
    <button onclick="generateShading('heavy')">Heavy</button>
    <button onclick="resetCanvas()">Reset</button>
  </div>
</main>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let baseImage = null;
let outlineImageData = null;

const lightAngle = -Math.PI / 3; // ÉN fast lyskilde (top-left)

// Upload
document.getElementById("upload").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;

  const img = new Image();
  img.onload = ()=>{
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);
    baseImage = img;
    outlineImageData = ctx.getImageData(0,0,canvas.width,canvas.height);
  };
  img.src = URL.createObjectURL(file);
});

// Reset
function resetCanvas(){
  if(!baseImage) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(baseImage,0,0);
}

// SHADING ENGINE (PRO)
function generateShading(level){
  if(!outlineImageData) return;

  const sctx = ctx;
  const data = outlineImageData.data;

  let density, alpha, length;

  if(level === "light"){
    density = 6;
    alpha = 0.12;
    length = 25;
  } else if(level === "medium"){
    density = 4;
    alpha = 0.18;
    length = 40;
  } else {
    density = 3;
    alpha = 0.26;
    length = 55;
  }

  sctx.save();
  sctx.lineCap = "round";

  for(let y=0; y<canvas.height; y+=density){
    for(let x=0; x<canvas.width; x+=density){

      const idx = (y * canvas.width + x) * 4;
      const r = data[idx];
      const g = data[idx+1];
      const b = data[idx+2];

      // KORREKT OUTLINE DETEKTION
      const brightness = (r + g + b) / 3;
      if(brightness > 200) continue;

      // Dirty hand randomness
      if(Math.random() > 0.55) continue;

      const len = length * (0.5 + Math.random());
      const angle = lightAngle + (Math.random()-0.5)*0.35;

      const grad = sctx.createLinearGradient(
        x, y,
        x + Math.cos(angle)*len,
        y + Math.sin(angle)*len
      );

      grad.addColorStop(0, `rgba(0,0,0,${alpha})`);
      grad.addColorStop(1, "rgba(0,0,0,0)");

      sctx.strokeStyle = grad;
      sctx.lineWidth = 1 + Math.random()*2;

      sctx.beginPath();
      sctx.moveTo(x,y);
      sctx.lineTo(
        x + Math.cos(angle)*len,
        y + Math.sin(angle)*len
      );
      sctx.stroke();
    }
  }

  sctx.restore();
}

// Service worker (PWA)
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
