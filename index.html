<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tattoo Shading Pro – Zone-Based</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#111;
  color:#fff;
}
header{
  padding:12px;
  text-align:center;
  background:#000;
  font-weight:600;
}
main{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  padding:10px;
}
canvas{
  width:100%;
  max-width:900px;
  margin:auto;
  background:#fff;
  border-radius:8px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
}
button{
  padding:10px 14px;
  border-radius:8px;
  border:none;
  background:#222;
  color:#fff;
  font-weight:600;
}
button:active{ background:#444; }
input[type=file]{ color:#fff; }
.guide{
  max-width:900px;
  margin:auto;
  background:#222;
  padding:12px;
  border-radius:8px;
  font-size:14px;
  line-height:1.5;
}
</style>
</head>

<body>
<header>Tattoo Shading Pro – Zone-Based</header>

<main>
  <input type="file" accept="image/*" id="upload">
  <canvas id="canvas"></canvas>

  <div class="controls">
    <button onclick="generateShading()">Generate Shading</button>
    <button onclick="resetCanvas()">Reset</button>
  </div>

  <div class="guide" id="guide"></div>
</main>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const guide = document.getElementById("guide");

let baseImage = null;
let outlineData = null;

// Upload stencil
document.getElementById("upload").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  img.onload = ()=>{
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);
    baseImage = img;
    outlineData = ctx.getImageData(0,0,canvas.width,canvas.height);
  };
  img.src = URL.createObjectURL(file);
});

function resetCanvas(){
  if(!baseImage) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(baseImage,0,0);
}

// ============================
// Zone-based shading
// ============================
function generateShading(){
  if(!outlineData) return;
  ctx.putImageData(outlineData,0,0);

  // Distance map approximation
  const width = canvas.width;
  const height = canvas.height;
  const data = outlineData.data;

  // Iterate through pixels
  for(let y=0; y<height; y++){
    for(let x=0; x<width; x++){
      const idx = (y*width + x)*4;
      const r = data[idx], g = data[idx+1], b = data[idx+2];
      const brightness = (r+g+b)/3;

      if(brightness>200) continue; // skip background

      // Approximate distance from outline using local darkness
      // closer to dark = heavy, medium, light
      let zone = "light";
      if(brightness<50) zone="heavy";
      else if(brightness<120) zone="medium";

      drawStroke(x, y, zone);
    }
  }

  drawGuide();
}

// Draw a small stroke at x,y based on zone
function drawStroke(x,y,zone){
  const sctx = ctx;
  sctx.save();
  sctx.lineCap="round";

  let alpha,length;
  if(zone==="heavy"){ alpha=0.26; length=12; }
  else if(zone==="medium"){ alpha=0.18; length=8; }
  else { alpha=0.12; length=5; }

  const angle = -Math.PI/3 + (Math.random()-0.5)*0.35; // light direction
  const pendulum = angle + Math.sin(x/10)*0.3;
  const circleX = Math.cos(y/8)*1.5;
  const circleY = Math.sin(x/10)*1.5;

  const grad = sctx.createLinearGradient(
    x,y,
    x+Math.cos(pendulum)*length+circleX,
    y+Math.sin(pendulum)*length+circleY
  );
  grad.addColorStop(0, `rgba(0,0,0,${alpha})`);
  grad.addColorStop(1,"rgba(0,0,0,0)");

  sctx.strokeStyle = grad;
  sctx.lineWidth = 1 + Math.random();
  sctx.beginPath();
  sctx.moveTo(x,y);
  sctx.lineTo(
    x+Math.cos(pendulum)*length+circleX,
    y+Math.sin(pendulum)*length+circleY
  );
  sctx.stroke();
  sctx.restore();
}

// ============================
// Auto guide – Needle + Greywash
// ============================
function drawGuide(){
  guide.innerHTML = `
<b>Auto Tattoo Guide – Poseidon Lucius</b><br><br>
<b>Heavy shadow zone</b><br>
Needle: 11–13RM<br>
Greywash: 1:3 – 1:4<br>
Voltage: 8.8–9.2V<br><br>

<b>Medium shadow zone</b><br>
Needle: 15–17M<br>
Greywash: 1:6 – 1:8<br>
Voltage: 7.5–8.0V<br><br>

<b>Light fade / whip</b><br>
Needle: 17–23CM<br>
Greywash: 1:10 – 1:12<br>
Voltage: 6.8–7.2V<br>
`;
}

// ============================
// PWA Service Worker
// ============================
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
