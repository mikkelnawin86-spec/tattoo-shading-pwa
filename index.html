<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tattoo Shading Pro – Greywash Extended</title>

<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#fff;}
header{padding:12px;text-align:center;background:#000;font-weight:600;}
main{display:grid;grid-template-columns:1fr;gap:10px;padding:10px;}
canvas{width:100%;max-width:900px;margin:auto;background:#fff;border-radius:8px;box-shadow:0 0 20px rgba(0,0,0,0.4);}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
button{padding:10px 14px;border-radius:8px;border:none;background:#222;color:#fff;font-weight:600;}
button:active{background:#444;}
input[type=file]{color:#fff;}
.progress-container{max-width:900px;margin:auto;background:#222;border-radius:8px;overflow:hidden;height:18px;margin-top:8px;}
.progress-bar{height:100%;width:0%;background:#4caf50;transition:width 0.05s linear;}
.guide{max-width:900px;margin:auto;background:#222;padding:12px;border-radius:8px;font-size:14px;line-height:1.5;margin-top:8px;}
</style>
</head>
<body>
<header>Tattoo Shading Pro – Greywash Extended</header>

<main>
<input type="file" accept="image/*" id="upload">
<canvas id="canvas"></canvas>

<div class="controls">
<button onclick="generateShading()">Generate Shading</button>
<button onclick="resetCanvas()">Reset</button>
</div>

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="guide" id="guide"></div>
</main>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const progressBar=document.getElementById("progressBar");
const guide=document.getElementById("guide");

let baseImage=null;
let outlineData=null;
const lightAngle=-Math.PI/3; // lysretning

// Lag til heavy/medium/light
let layers={heavy:null,medium:null,light:null};

document.getElementById("upload").addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file) return;
  const img=new Image();
  img.onload=()=>{
    canvas.width=img.width;
    canvas.height=img.height;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);
    baseImage=img;
    outlineData=ctx.getImageData(0,0,canvas.width,canvas.height);

    layers.heavy=document.createElement("canvas");
    layers.medium=document.createElement("canvas");
    layers.light=document.createElement("canvas");
    [layers.heavy,layers.medium,layers.light].forEach(c=>{
      c.width=canvas.width;
      c.height=canvas.height;
    });
  };
  img.src=URL.createObjectURL(file);
});

function resetCanvas(){
  if(!baseImage) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(baseImage,0,0);
  progressBar.style.width="0%";
}

// Simple edge detection
function detectEdges(imgData){
  const w=imgData.width;
  const h=imgData.height;
  const data=imgData.data;
  const edges=[];
  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){
      const idx=(y*w+x)*4;
      const brightness=(data[idx]+data[idx+1]+data[idx+2])/3;
      if(brightness<128) edges.push({x,y});
    }
  }
  return edges;
}

// Generate shading
function generateShading(){
  if(!outlineData) return;
  ctx.putImageData(outlineData,0,0);
  const edges=detectEdges(outlineData);
  let i=0;
  const batchSize=2000;

  function processBatch(){
    for(let b=0;b<batchSize && i<edges.length;i++,b++){
      const {x,y}=edges[i];
      // Heavy further out
      drawLayerStroke(x,y,layers.heavy,0,6,0.28,16);
      drawLayerStroke(x,y,layers.medium,6,12,0.18,12);
      drawLayerStroke(x,y,layers.light,12,20,0.10,8);
    }
    // Statusbar
    const percent=((i/edges.length)*100).toFixed(1);
    progressBar.style.width=percent+"%";
    progressBar.textContent=percent+"%";
    if(i<edges.length) requestAnimationFrame(processBatch);
    else drawCombined();
  }
  requestAnimationFrame(processBatch);
}

function drawLayerStroke(x,y,layer,offsetMin,offsetMax,alpha,length){
  const sctx=layer.getContext("2d");
  sctx.save();
  sctx.lineCap="round";

  const dx=Math.cos(lightAngle);
  const dy=Math.sin(lightAngle);
  const offset=offsetMin + Math.random()*(offsetMax-offsetMin);
  const targetX=x-dx*offset;
  const targetY=y-dy*offset;
  const angle=lightAngle+Math.PI/2+(Math.random()-0.5)*0.35;

  const grad=sctx.createLinearGradient(x,y,targetX+Math.cos(angle)*length,targetY+Math.sin(angle)*length);
  grad.addColorStop(0,`rgba(0,0,0,${alpha})`);
  grad.addColorStop(1,"rgba(0,0,0,0)");

  sctx.strokeStyle=grad;
  sctx.lineWidth=1+Math.random()*0.5;
  sctx.beginPath();
  sctx.moveTo(x,y);
  sctx.lineTo(targetX+Math.cos(angle)*length,targetY+Math.sin(angle)*length);
  sctx.stroke();
  sctx.restore();
}

// Combine layers + outline
function drawCombined(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(baseImage,0,0);
  ctx.drawImage(layers.heavy,0,0);
  ctx.drawImage(layers.medium,0,0);
  ctx.drawImage(layers.light,0,0);
  drawGuide();
}

// Auto-guide
function drawGuide(){
  guide.innerHTML=`
<b>Auto Tattoo Guide – Poseidon Lucius</b><br><br>
<b>Heavy shadow zone</b><br>
Needle: 11–13RM<br>
Greywash: 1:3 – 1:4<br>
Voltage: 8.8–9.2V<br><br>
<b>Medium shadow zone</b><br>
Needle: 15–17M<br>
Greywash: 1:6 – 1:8<br>
Voltage: 7.5–8.0V<br><br>
<b>Light fade / whip</b><br>
Needle: 17–23CM<br>
Greywash: 1:10 – 1:12<br>
Voltage: 6.8–7.2V<br>
`;
}
</script>
</body>
</html>
