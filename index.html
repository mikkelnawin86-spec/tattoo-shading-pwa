<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tattoo Shading Pro – Advanced Greywash</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#fff;}
header{padding:12px;text-align:center;background:#000;font-weight:600;}
main{display:grid;gap:10px;padding:10px;}
canvas{width:100%;max-width:900px;margin:auto;background:#fff;border-radius:8px;box-shadow:0 0 20px rgba(0,0,0,0.4);}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
button, select{padding:10px 14px;border-radius:8px;border:none;background:#222;color:#fff;font-weight:600;}
button:active, select:active{background:#444;}
input[type=file]{color:#fff;}
.progress-container{max-width:900px;margin:auto;background:#222;border-radius:8px;overflow:hidden;height:18px;margin-top:8px;}
.progress-bar{height:100%;width:0%;background:#4caf50;transition:width 0.05s linear;}
.guide{max-width:900px;margin:auto;background:#222;padding:12px;border-radius:8px;font-size:14px;line-height:1.5;margin-top:8px;}
</style>
</head>
<body>

<header>Tattoo Shading Pro – Advanced Greywash</header>

<main>
<input type="file" accept="image/*" id="upload">
<select id="preset">
  <option value="realism">Realism</option>
  <option value="illustrative">Illustrative</option>
  <option value="blackwork">Blackwork</option>
</select>

<canvas id="canvas"></canvas>

<div class="controls">
<button onclick="generateShading()">Generate Shading</button>
<button onclick="resetCanvas()">Reset</button>
<button onclick="exportPDF()">Export PDF</button>
</div>

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="guide" id="guide"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const progressBar=document.getElementById("progressBar");
const guide=document.getElementById("guide");
const presetSelect=document.getElementById("preset");

let baseImage=null;
let outlineData=null;
const lightAngle=-Math.PI/3;
let layers={heavy:null,medium:null,light:null};

document.getElementById("upload").addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file) return;
  const img=new Image();
  img.onload=()=>{
    canvas.width=img.width;
    canvas.height=img.height;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);
    baseImage=img;
    outlineData=ctx.getImageData(0,0,canvas.width,canvas.height);

    layers.heavy=document.createElement("canvas");
    layers.medium=document.createElement("canvas");
    layers.light=document.createElement("canvas");
    [layers.heavy,layers.medium,layers.light].forEach(c=>{
      c.width=canvas.width;
      c.height=canvas.height;
    });
  };
  img.src=URL.createObjectURL(file);
});

function resetCanvas(){
  if(!baseImage) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(baseImage,0,0);
  progressBar.style.width="0%";
}

// Edge detection
function detectEdges(imgData){
  const w=imgData.width,h=imgData.height;
  const data=imgData.data;
  const edges=[];
  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){
      const i=(y*w+x)*4;
      const b=(data[i]+data[i+1]+data[i+2])/3;
      if(b<128) edges.push({x,y});
    }
  }
  return edges;
}

// Shading parameters per preset
const presets={
  realism:{heavy:[0,8,0.35,18],medium:[8,16,0.25,14],light:[16,28,0.15,10]},
  illustrative:{heavy:[0,6,0.4,14],medium:[6,12,0.3,10],light:[12,24,0.18,8]},
  blackwork:{heavy:[0,4,0.5,12],medium:[4,8,0.3,8],light:[8,16,0.1,6]}
};

function generateShading(){
  if(!outlineData) return;
  ctx.putImageData(outlineData,0,0);
  const edges=detectEdges(outlineData);
  let i=0;
  const batchSize=2000;
  const preset=presets[presetSelect.value];

  function processBatch(){
    for(let b=0;b<batchSize && i<edges.length;i++,b++){
      const {x,y}=edges[i];
      drawLayer(x,y,layers.heavy,...preset.heavy);
      drawLayer(x,y,layers.medium,...preset.medium);
      drawLayer(x,y,layers.light,...preset.light);
    }
    const pct=((i/edges.length)*100).toFixed(1)+"%";
    progressBar.style.width=pct;
    progressBar.textContent=pct+"%";
    if(i<edges.length) requestAnimationFrame(processBatch);
    else combineLayers();
  }
  progressBar.textContent="";
  requestAnimationFrame(processBatch);
}

// Vægtet curvature shading
function drawLayer(x,y,layer,offsetMin,offsetMax,alpha,length){
  const sctx=layer.getContext("2d");
  sctx.save();
  sctx.lineCap="round";

  // Curvature simulation: tilfældig variation for “surface feel”
  const curvature=Math.random()*0.35 - 0.15; 
  const dx=Math.cos(lightAngle)*(1+curvature);
  const dy=Math.sin(lightAngle)*(1+curvature);
  const offset=offsetMin + Math.random()*(offsetMax-offsetMin);
  const tx=x - dx*offset;
  const ty=y - dy*offset;

  const angle=lightAngle + Math.PI/2 + (Math.random()-0.5)*0.35;

  const grad=sctx.createLinearGradient(x,y,tx+Math.cos(angle)*length,ty+Math.sin(angle)*length);
  grad.addColorStop(0,`rgba(0,0,0,${alpha})`);
  grad.addColorStop(1,"rgba(0,0,0,0)");

  sctx.strokeStyle=grad;
  sctx.lineWidth=1+Math.random()*0.8;
  sctx.beginPath();
  sctx.moveTo(x,y);
  sctx.lineTo(tx+Math.cos(angle)*length,ty+Math.sin(angle)*length);
  sctx.stroke();
  sctx.restore();
}

function combineLayers(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(baseImage,0,0);
  ctx.drawImage(layers.heavy,0,0);
  ctx.drawImage(layers.medium,0,0);
  ctx.drawImage(layers.light,0,0);
  drawGuide();
}

function exportPDF(){
  const { jsPDF }=window.jspdf;
  const pdf=new jsPDF({orientation:"portrait",unit:"px",format:[canvas.width,canvas.height]});
  pdf.addImage(baseImage.src,"PNG",0,0,canvas.width,canvas.height);
  pdf.addImage(layers.heavy.toDataURL(),"PNG",0,0,canvas.width,canvas.height);
  pdf.addImage(layers.medium.toDataURL(),"PNG",0,0,canvas.width,canvas.height);
  pdf.addImage(layers.light.toDataURL(),"PNG",0,0,canvas.width,canvas.height);
  pdf.save("tattoo_layers.pdf");
}

function drawGuide(){
  guide.innerHTML=`
<b>Auto Tattoo Guide – Poseidon Lucius</b><br><br>
<b>Heavy shadows:</b><br>
11–13RM · Greywash 1:3–1:4 · 8.8–9.2V<br><br>
<b>Medium tones:</b><br>
15–17M · Greywash 1:6–1:8 · 7.5–8.0V<br><br>
<b>Light fade / whip:</b><br>
17–23CM · Greywash 1:10–1:12 · 6.8–7.2V<br><br>
<b>Preset style:</b> ${presetSelect.value} · Vægtet curvature shading
`;
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
