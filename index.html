<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Tattoo Shading Pro – Studio Engine</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#111">

<style>
body{margin:0;background:#111;color:#eee;font-family:Arial}
header{text-align:center;padding:10px;font-weight:bold}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:10px}
.viewer{display:flex;justify-content:center;padding:10px}
canvas{
  background:#fff;
  max-height:70vh;
  max-width:100%;
  border-radius:8px;
  box-shadow:0 0 20px rgba(0,0,0,.4)
}
.progress{height:14px;background:#333;margin:10px;border-radius:7px;overflow:hidden}
.progress div{height:100%;width:0%;background:#aaa;color:#000;font-size:10px;text-align:center}
.guide{padding:12px;max-width:900px;margin:auto;font-size:14px}
</style>
</head>

<body>
<header>🖤 Tattoo Shading Pro – Studio Engine</header>

<div class="controls">
  <input type="file" id="upload">
  <select id="style">
    <option value="luxury">Luxury realism</option>
    <option value="dirty">Dirty illustrative</option>
  </select>
  <button onclick="generate()">Generate shading</button>
</div>

<div class="progress"><div id="bar">0%</div></div>

<div class="viewer">
  <canvas id="canvas"></canvas>
</div>

<div class="guide" id="guide"></div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const bar=document.getElementById("bar");
const guide=document.getElementById("guide");

let outlineImg=null;
let shadingLayer=null;

// -------- UPLOAD ----------
document.getElementById("upload").onchange=e=>{
  const img=new Image();
  img.onload=()=>{
    canvas.width=img.width;
    canvas.height=img.height;
    ctx.drawImage(img,0,0);
    outlineImg=ctx.getImageData(0,0,canvas.width,canvas.height);
  };
  img.src=URL.createObjectURL(e.target.files[0]);
};

// -------- SHADING ENGINE ----------
function generate(){
  if(!outlineImg) return;
  shadingLayer=document.createElement("canvas");
  shadingLayer.width=canvas.width;
  shadingLayer.height=canvas.height;
  const sctx=shadingLayer.getContext("2d");

  const style=document.getElementById("style").value;
  const strokes = style==="dirty" ? 9000 : 6500;
  const maxLen = style==="dirty" ? 45 : 30;
  const alphaBase = style==="dirty" ? 0.06 : 0.04;

  let i=0;
  function step(){
    for(let n=0;n<120 && i<strokes;n++,i++){
      const x=Math.random()*canvas.width;
      const y=Math.random()*canvas.height;
      const idx=((y|0)*canvas.width+(x|0))*4;

      // kun tæt på outline
      if(outlineImg.data[idx]<80){
        const len=maxLen*(0.3+Math.random());
        const angle=(-Math.PI/4)+(Math.random()*Math.PI/6);
        const grad=sctx.createLinearGradient(
          x,y,
          x+Math.cos(angle)*len,
          y+Math.sin(angle)*len
        );
        grad.addColorStop(0,`rgba(0,0,0,${alphaBase})`);
        grad.addColorStop(1,"rgba(0,0,0,0)");

        sctx.strokeStyle=grad;
        sctx.lineWidth=1+Math.random()*2;
        sctx.beginPath();
        sctx.moveTo(x,y);
        sctx.lineTo(
          x+Math.cos(angle)*len,
          y+Math.sin(angle)*len
        );
        sctx.stroke();
      }
    }
    bar.style.width=Math.round(i/strokes*100)+"%";
    bar.innerText=Math.round(i/strokes*100)+"%";

    ctx.putImageData(outlineImg,0,0);
    ctx.drawImage(shadingLayer,0,0);

    if(i<strokes) requestAnimationFrame(step);
    else finish();
  }
  step();
}

function finish(){
  bar.innerText="Ready";
  guide.innerHTML=`
<b>Auto Tattoo Guide – Poseidon Lucius</b><br><br>
<b>Heavy zones</b><br>
• Needle: 11–13RM<br>
• Greywash: 1:3 – 1:4<br>
• Voltage: 8.8 – 9.2V<br><br>

<b>Medium blend</b><br>
• Needle: 15–17M<br>
• Greywash: 1:6 – 1:8<br>
• Voltage: 7.5 – 8.0V<br><br>

<b>Light whip</b><br>
• Needle: 17–23CM<br>
• Greywash: 1:10 – 1:12<br>
• Voltage: 6.8 – 7.2V<br><br>

<b>Style:</b> ${document.getElementById("style").value}
`;
}
</script>
</body>
</html>
