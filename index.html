<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tattoo Shading Pro – IR Live Preview</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#fff;}
header{padding:12px;text-align:center;background:#000;font-weight:600;}
main{display:grid;gap:10px;padding:10px;}
canvas{width:100%;max-width:900px;margin:auto;background:#fff;border-radius:8px;box-shadow:0 0 20px rgba(0,0,0,0.4);}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
button, select, input[type=range]{padding:10px 14px;border-radius:8px;border:none;background:#222;color:#fff;font-weight:600;}
button:active, select:active, input:active{background:#444;}
input[type=file]{color:#fff;}
.progress-container{max-width:900px;margin:auto;background:#222;border-radius:8px;overflow:hidden;height:18px;margin-top:8px;}
.progress-bar{height:100%;width:0%;background:#4caf50;transition:width 0.05s linear;}
.slider-container{display:grid;gap:6px;max-width:900px;margin:auto;}
.guide{max-width:900px;margin:auto;background:#222;padding:12px;border-radius:8px;font-size:14px;line-height:1.5;margin-top:8px;}
</style>
</head>
<body>

<header>Tattoo Shading Pro – IR Live Preview</header>

<main>
<input type="file" accept="image/*" id="upload">
<select id="preset">
  <option value="realism">Realism</option>
  <option value="illustrative" selected>Illustrative</option>
  <option value="blackwork">Blackwork</option>
</select>

<div class="slider-container">
<label>Heavy intensity <span id="heavyVal">0.35</span></label>
<input type="range" id="heavySlider" min="0.1" max="0.6" step="0.01" value="0.35">
<label>Medium intensity <span id="mediumVal">0.25</span></label>
<input type="range" id="mediumSlider" min="0.05" max="0.5" step="0.01" value="0.25">
<label>Light intensity <span id="lightVal">0.15</span></label>
<input type="range" id="lightSlider" min="0.02" max="0.3" step="0.01" value="0.15">
<label>Spread distance <span id="spreadVal">35</span>px</label>
<input type="range" id="spreadSlider" min="5" max="60" step="1" value="35">
</div>

<canvas id="canvas"></canvas>

<div class="controls">
<button onclick="startLiveShading()">Start Live Shading</button>
<button onclick="resetCanvas()">Reset</button>
<button onclick="exportPDF()">Export PDF</button>
</div>

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="guide" id="guide"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const progressBar=document.getElementById("progressBar");
const guide=document.getElementById("guide");
const presetSelect=document.getElementById("preset");

let baseImage=null;
let outlineData=null;
const lightAngle=-Math.PI/3;
let layers={heavy:null,medium:null,light:null};

// sliders
const heavySlider=document.getElementById("heavySlider");
const mediumSlider=document.getElementById("mediumSlider");
const lightSlider=document.getElementById("lightSlider");
const spreadSlider=document.getElementById("spreadSlider");
function updateSliderLabels(){
  document.getElementById("heavyVal").textContent=heavySlider.value;
  document.getElementById("mediumVal").textContent=mediumSlider.value;
  document.getElementById("lightVal").textContent=lightSlider.value;
  document.getElementById("spreadVal").textContent=spreadSlider.value;
}
[heavySlider,mediumSlider,lightSlider,spreadSlider].forEach(s=>s.addEventListener("input",()=>{updateSliderLabels();}));
updateSliderLabels();

// upload image
document.getElementById("upload").addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file) return;
  const img=new Image();
  img.onload=()=>{
    canvas.width=img.width;
    canvas.height=img.height;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);
    baseImage=img;
    outlineData=ctx.getImageData(0,0,canvas.width,canvas.height);

    layers.heavy=document.createElement("canvas");
    layers.medium=document.createElement("canvas");
    layers.light=document.createElement("canvas");
    [layers.heavy,layers.medium,layers.light].forEach(c=>{
      c.width=canvas.width;
      c.height=canvas.height;
    });
  };
  img.src=URL.createObjectURL(file);
});

function resetCanvas(){
  if(!baseImage) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(baseImage,0,0);
  progressBar.style.width="0%";
}

// simple edge detection
function detectEdges(imgData){
  const w=imgData.width,h=imgData.height;
  const data=imgData.data;
  const edges=[];
  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){
      const i=(y*w+x)*4;
      const b=(data[i]+data[i+1]+data[i+2])/3;
      if(b<128) edges.push({x,y});
    }
  }
  return edges;
}

// compute passes for IR shading: max 2
function computePasses(alpha){
  if(alpha>0.4) return 2;
  return 1;
}

// live shading variables
let liveEdges=[];
let liveIndex=0;
let isLive=false;

function startLiveShading(){
  if(!outlineData) return;
  ctx.putImageData(outlineData,0,0);
  liveEdges=detectEdges(outlineData);
  liveIndex=0;
  isLive=true;
  liveLoop();
}

function liveLoop(){
  if(!isLive) return;
  const batchSize=500;
  for(let b=0;b<batchSize && liveIndex<liveEdges.length;liveIndex++,b++){
    const {x,y}=liveEdges[liveIndex];
    drawLayerAdaptive(x,y,layers.heavy,0,parseInt(spreadSlider.value),parseFloat(heavySlider.value),24,true);
    drawLayerAdaptive(x,y,layers.medium,parseInt(spreadSlider.value)/2,parseInt(spreadSlider.value)*0.8,parseFloat(mediumSlider.value),18,true);
    drawLayerAdaptive(x,y,layers.light,parseInt(spreadSlider.value)*0.6,parseInt(spreadSlider.value),parseFloat(lightSlider.value),14,true);
  }
  const pct=((liveIndex/liveEdges.length)*100).toFixed(1)+"%";
  progressBar.style.width=pct+"%";
  progressBar.textContent=pct+"%";

  combineLayers();
  if(liveIndex<liveEdges.length) requestAnimationFrame(liveLoop);
  else { isLive=false; drawGuide(); }
}

// Artistic adaptive shading function
function drawLayerAdaptive(x,y,layer,offsetMin,offsetMax,alpha,length,artistic){
  const sctx=layer.getContext("2d");
  sctx.save();
  sctx.lineCap="round";

  const curvature=Math.random()*0.35-0.15;
  const dx=Math.cos(lightAngle)*(1+curvature);
  const dy=Math.sin(lightAngle)*(1+curvature);
  const offset=offsetMin+Math.random()*(offsetMax-offsetMin);
  const tx=x-dx*offset;
  const ty=y-dy*offset;

  let angle=lightAngle+Math.PI/2+(Math.random()-0.5)*0.35;
  if(artistic) angle += (Math.random()-0.5)*0.7;

  const passes=computePasses(alpha);
  for(let p=0;p<passes;p++){
    const grad=sctx.createLinearGradient(x,y,tx+Math.cos(angle)*(length+p),ty+Math.sin(angle)*(length+p));
    grad.addColorStop(0,`rgba(0,0,0,${alpha/(p+1)})`);
    grad.addColorStop(0.3,`rgba(0,0,0,${alpha*0.6/(p+1)})`);
    grad.addColorStop(0.6,`rgba(0,0,0,${alpha*0.3/(p+1)})`);
    grad.addColorStop(1,"rgba(0,0,0,0)");
    sctx.strokeStyle=grad;
    sctx.lineWidth=1+Math.random()*1.2;
    sctx.beginPath();
    sctx.moveTo(x,y);
    sctx.lineTo(tx+Math.cos(angle)*(length+p),ty+Math.sin(angle)*(length+p));
    sctx.stroke();
  }
  sctx.restore();
}

function combineLayers(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(baseImage,0,0);
  ctx.drawImage(layers.heavy,0,0);
  ctx.drawImage(layers.medium,0,0);
  ctx.drawImage(layers.light,0,0);
}

function exportPDF(){
  const { jsPDF }=window.jspdf;
  const pdf=new jsPDF({orientation:"portrait",unit:"px",format:[canvas.width,canvas.height]});
  pdf.addImage(baseImage.src,"PNG",0,0,canvas.width,canvas.height);
  pdf.addImage(layers.heavy.toDataURL(),"PNG",0,0,canvas.width,canvas.height);
  pdf.addImage(layers.medium.toDataURL(),"PNG",0,0,canvas.width,canvas.height);
  pdf.addImage(layers.light.toDataURL(),"PNG",0,0,canvas.width,canvas.height);
  pdf.save("tattoo_layers.pdf");
}

function drawGuide(){
  guide.innerHTML=`
<b>IR Live Adaptive Tattoo Guide – Poseidon Lucius</b><br><br>
<b>Heavy shadows:</b> 11–13RM · Greywash 1:3–1:4 · 8.8–9.2V<br>
<b>Medium tones:</b> 15–17M · Greywash 1:6–1:8 · 7.5–8.0V<br>
<b>Light fade / whip:</b> 17–23CM · Greywash 1:10–1:12 · 6.8–7.2V<br><br>
<b>Preset style:</b> ${presetSelect.value} · IR Live Preview<br>
<b>Sliders update intensity and spread in real-time</b>
`;
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
