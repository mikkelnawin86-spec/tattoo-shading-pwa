<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Tattoo Shading Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Shading Pro">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;background:#111;color:#eee;font-family:Arial}
header{padding:10px;font-weight:bold}
.controls{display:flex;gap:15px;flex-wrap:wrap;padding:10px}
canvas{background:#fff;display:block;margin:auto;border-radius:8px}
.progress{height:16px;background:#333;margin:10px;border-radius:8px;overflow:hidden}
.progress div{height:100%;width:0%;background:linear-gradient(90deg,#555,#eee);font-size:11px;color:#000;text-align:center}
button,select,input{background:#222;color:#eee;border:none;padding:6px;border-radius:6px}
.guide{padding:10px;font-size:14px;line-height:1.5}
</style>
</head>

<body>

<header>🖤 Tattoo Shading Pro (PWA)</header>

<div class="controls">
<input type="file" id="upload">
<select id="style">
  <option value="clean">Clean luxury realism</option>
  <option value="dirty">Dirty illustrative</option>
</select>
<button onclick="exportPDF()">Export PDF stencil</button>
</div>

<div class="progress"><div id="bar">0%</div></div>

<canvas id="canvas"></canvas>

<div class="guide" id="guide"></div>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const bar=document.getElementById("bar");
const guide=document.getElementById("guide");

let baseImage=null;
let shadingImage=null;

document.getElementById("upload").onchange=e=>{
  const img=new Image();
  img.onload=()=>{
    canvas.width=img.width;
    canvas.height=img.height;
    ctx.drawImage(img,0,0);
    baseImage=ctx.getImageData(0,0,canvas.width,canvas.height);
    generateShading();
  };
  img.src=URL.createObjectURL(e.target.files[0]);
};

function generateShading(){
  const w=canvas.width,h=canvas.height;
  shadingImage=ctx.createImageData(w,h);
  const style=document.getElementById("style").value;

  const lightDir={x:-1,y:-1};
  const reach=140;
  const depth=160;

  let y=0;

  function step(){
    for(let n=0;n<12 && y<h;n++,y++){
      for(let x=0;x<w;x++){
        let minD=reach,dx=0,dy=0;

        for(let oy=-reach;oy<=reach;oy++){
          for(let ox=-reach;ox<=reach;ox++){
            const xx=x+ox,yy=y+oy;
            if(xx<0||yy<0||xx>=w||yy>=h) continue;
            const i=(yy*w+xx)*4;
            if(baseImage.data[i]<80){
              const d=Math.hypot(ox,oy);
              if(d<minD){minD=d;dx=ox;dy=oy;}
            }
          }
        }

        if(minD<reach && dx*lightDir.x+dy*lightDir.y<0){
          let t=minD/reach;
          let jitter=style==="dirty"?0.85+Math.random()*0.4:1;
          let heavy=Math.pow(1-t,2.8)*jitter;
          let medium=Math.pow(1-t,2.1)*jitter*0.65;
          let light=Math.pow(1-t,1.6)*jitter*0.35;

          let shade=0;
          if(t<0.4) shade=depth*heavy;
          else if(t<0.75) shade=depth*medium;
          else shade=depth*light;

          const o=(y*w+x)*4;
          shadingImage.data[o]=shade;
          shadingImage.data[o+1]=shade;
          shadingImage.data[o+2]=shade;
          shadingImage.data[o+3]=Math.min(220,shade);
        }
      }
    }

    ctx.putImageData(shadingImage,0,0);
    bar.style.width=Math.round(y/h*100)+"%";
    bar.innerText=Math.round(y/h*100)+"%";

    if(y<h) requestAnimationFrame(step);
    else finish();
  }
  step();
}

function finish(){
  bar.innerText="Ready";
  guide.innerHTML=`
<b>Auto Tattoo Guide – Poseidon Lucius</b><br><br>

<b>Heavy shadow zones</b><br>
• Needle: 11–13RM<br>
• Greywash: 1:3 – 1:4<br>
• Voltage: 8.8 – 9.2V<br><br>

<b>Medium blend zones</b><br>
• Needle: 15–17M<br>
• Greywash: 1:6 – 1:8<br>
• Voltage: 7.5 – 8.0V<br><br>

<b>Light finish / whip</b><br>
• Needle: 17–23CM<br>
• Greywash: 1:10 – 1:12<br>
• Voltage: 6.8 – 7.2V<br><br>

<b>Style:</b> ${document.getElementById("style").value}
`;
}

/* ✏️ Apple Pencil – pressure preview */
canvas.addEventListener("pointermove",e=>{
  if(e.pressure>0){
    ctx.globalAlpha=e.pressure*0.15;
    ctx.beginPath();
    ctx.arc(e.offsetX,e.offsetY,8,0,Math.PI*2);
    ctx.fillStyle="#000";
    ctx.fill();
    ctx.globalAlpha=1;
  }
});

/* 📄 PDF EXPORT */
function exportPDF(){
  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF({orientation:"portrait",unit:"px",format:[canvas.width,canvas.height]});
  pdf.addImage(canvas.toDataURL("image/png"),"PNG",0,0,canvas.width,canvas.height);
  pdf.save("tattoo-stencil-shading.pdf");
}
</script>

</body>
</html>
